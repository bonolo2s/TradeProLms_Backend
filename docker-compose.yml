#version: '3.8'
# This is my automation guy for netwroking among my microServices
services:
  api-gateway:
    build:
      context: .
      dockerfile: ApiGateways/GatewayAPI/Dockerfile
    container_name: api-gateway
    ports:
      - "5000:80"   # map host 5000 to container 80
    networks:
      - app-network

  user-read:
    build:
      context: .
      dockerfile: services/UserService/UserRead/UserRead.API/Dockerfile
    container_name: user-read
    ports:
      - "5001:80"   # map host 5001 to container 80
    networks:
      - app-network

  user-write:
    build:
      context: .
      dockerfile: services/UserService/UserWrite/UserWrite.API/Dockerfile
    container_name: user-write
    ports:
      - "5002:80"   # map host 5002 to container 80
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

